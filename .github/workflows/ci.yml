name: CI

on: [push]

permissions:
  contents: write

jobs:
  lint:
    if: contains(github.event.head_commit.message, '#go') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  build:
    if: contains(github.event.head_commit.message, '#go') || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o adbjson ./cmd/adbjson
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: adbjson-${{ matrix.os }}
          path: adbjson*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/adbjson-linux-amd64 ./cmd/adbjson
          GOOS=linux GOARCH=arm64 go build -o dist/adbjson-linux-arm64 ./cmd/adbjson
          GOOS=darwin GOARCH=amd64 go build -o dist/adbjson-darwin-amd64 ./cmd/adbjson
          GOOS=darwin GOARCH=arm64 go build -o dist/adbjson-darwin-arm64 ./cmd/adbjson
          GOOS=windows GOARCH=amd64 go build -o dist/adbjson-windows-amd64.exe ./cmd/adbjson

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true


